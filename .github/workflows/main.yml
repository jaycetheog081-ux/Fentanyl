name: "Fentanyl: build and upload"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1 *'
    - cron: '0 0 1 4 *'
    - cron: '0 0 30 6 *'
    - cron: '0 0 28 9 *'
    - cron: '0 0 27 12 *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Install THEOS
        run: |
          set -euo pipefail

          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"

          mkdir -p "$THEOS"

          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o install-theos.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path("install-theos.sh")
          lines = path.read_text().splitlines()

          for index, line in enumerate(lines):
              if line.strip() == "get_theos":
                  for next_index in range(index + 1, min(index + 3, len(lines))):
                      if lines[next_index].strip() == "get_sdks":
                          indent = lines[next_index][:len(lines[next_index]) - len(lines[next_index].lstrip())]
                          lines[next_index:next_index + 1] = [
                              indent + 'mkdir -p "${THEOS}/sdks"',
                              indent + 'touch "${THEOS}/sdks/sdk"',
                              indent + "get_sdks"
                          ]
                          path.write_text("\n".join(lines) + "\n")
                          print("Patched THEOS SDK setup.")
                          break
                  else:
                      raise SystemExit("Could not find get_sdks after get_theos.")
                  break
          else:
              raise SystemExit("Could not find get_theos in installer.")
          PY

          bash install-theos.sh

          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

          tar -xJf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"

          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

      - name: Build and Install trustcache
        run: |
          set -euo pipefail

          git clone https://github.com/CRKatri/trustcache
          cd trustcache

          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl)/lib -arch arm64"

          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1

          sudo install -d /opt/procursus/bin
          sudo install -m 755 trustcache /opt/procursus/bin/trustcache

      - name: Set Environment Variables
        run: |
          set -euo pipefail

          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)

          echo "ctime=${T2}" >> "$GITHUB_ENV"
          echo "ctimestamp=${TS}" >> "$GITHUB_ENV"
          echo "shorthash=${SHASH}" >> "$GITHUB_ENV"

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Download Bootstraps
        run: |
          set -euo pipefail

          cd Application/Dopamine/Resources
          ./download_bootstraps.sh

      - name: Build
        run: |
          set -euo pipefail

          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"

          gmake -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1

      - name: Verify IPA
        run: |
          set -euo pipefail

          if [ ! -f "Application/Fentanyl.ipa" ]; then
            echo "::error::Fentanyl.ipa was not generated."
            echo "Available IPA files:"
            find . -name "*.ipa" -print
            exit 1
          fi

          ls -lh Application/Fentanyl.ipa

      - name: Upload Artifact
        id: fentanyl-latest-upload
        uses: actions/upload-artifact@main
        with:
          name: Fentanyl
          path: Application/Fentanyl.ipa
          if-no-files-found: error
